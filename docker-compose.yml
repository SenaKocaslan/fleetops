# Gelistirme ve e2e icin veritabani. Api ve web servisleri Gun 9'da eklenecek.
services:
  db:
    image: postgres:17-alpine
    container_name: fleetops-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetops}
      POSTGRES_USER: ${POSTGRES_USER:-fleetops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fleetops}
    ports:
      # Sistemde PostgreSQL 14 servisi 5432i kullaniyor; ona dokunmamak icin
      # host tarafinda 55432e baglaniyoruz.
      - "55432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      # Api ve migration adimi, veritabani gercekten hazir olmadan baslamasin.
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetops} -d ${POSTGRES_DB:-fleetops}"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db-data:
