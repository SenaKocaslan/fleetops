server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular router yol tabanli calisir: /tasks dogrudan acildiginda diskte
    # o isimde dosya yok. index.html'e dusmezse yenileme 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API ile arayuz AYNI ORIGIN'den servis ediliyor. Bunun sonucu: uretimde
    # CORS'a hic ihtiyac yok, token'i tasiyan istek cross-origin degil.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass http://api:8080;

        # WebSocket el sikismasi HTTP/1.1 ve Upgrade basligi ister;
        # bunlar olmadan SignalR sessizce long-polling'e duser.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # Canli filo baglantisi saatlerce acik kalir; varsayilan 60 sn keser.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
