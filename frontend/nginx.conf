# IP basina giris sinirlamasi BURADA, uygulamada degil. API nginx'in arkasinda
# oldugu icin uygulama her istegi nginx'in IP'sinden gelmis gibi gorur; orada
# IP'ye gore sinirlamak tum kullanicilari tek kovaya koyardi. X-Forwarded-For'a
# guvenmek de cozum degil: 5200 portu acik ve basligi istemci doldurabilir.
# Uygulamadaki sinir kullanici adi basina; bu ise PBKDF2'nin her denemede
# harcadigi ~60 ms CPU'yu, cok sayida farkli kullanici adiyla tuketmeye karsi.
limit_req_zone $binary_remote_addr zone=giris:1m rate=10r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # proxy_pass'e sabit ad yazilirsa nginx "api" adini yalnizca ACILISTA
    # cozer ve IP'yi saklar. Olculdu (2026-09-11): api konteyneri yeniden
    # olusturulup yeni IP aldiginda nginx eski IP'ye gitmeye devam etti ve
    # tum API cagrilari 502 dondu. Docker'in gomulu DNS'i + degiskenle verilen
    # adres: ad her istekte cozulur (valid suresi kadar onbellekte kalir).
    #
    # valid=2s: onbellekte yalnizca olu bir adres kaldiginda nginx o sure
    # boyunca tum istekleri oraya gonderir. Olculdu: 10s ile dogru adrese
    # gecis 7.7 ve 11.6 sn surdu; CI'da api yeniden baslatildiktan sonraki
    # ilk istegin 502 almasi da bundandi. Bedeli daha sik DNS sorgusu; o DNS
    # makinenin icinde, maliyeti ihmal edilebilir.
    resolver 127.0.0.11 valid=2s ipv6=off;
    set $api_adresi http://api:8080;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Angular router yol tabanli calisir: /tasks dogrudan acildiginda diskte
    # o isimde dosya yok. index.html'e dusmezse yenileme 404 verir.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Dakikada 10, anlik 5'e kadar tampon: parolasini iki kez yanlis yazan
    # insan hic fark etmez, otomatik deneme ise hizla 429 alir.
    location = /api/auth/login {
        limit_req zone=giris burst=5 nodelay;
        limit_req_status 429;

        proxy_pass $api_adresi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API ile arayuz AYNI ORIGIN'den servis ediliyor. Bunun sonucu: uretimde
    # CORS'a hic ihtiyac yok, token'i tasiyan istek cross-origin degil.
    location /api/ {
        proxy_pass $api_adresi;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hubs/ {
        proxy_pass $api_adresi;

        # WebSocket el sikismasi HTTP/1.1 ve Upgrade basligi ister;
        # bunlar olmadan SignalR sessizce long-polling'e duser.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host       $host;

        # Canli filo baglantisi saatlerce acik kalir; varsayilan 60 sn keser.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
