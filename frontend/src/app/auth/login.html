<section class="giris-kart panel">
  <h1>Giriş yap</h1>
  <p class="aciklama">Görev havuzunu ve filoyu yönetmek için oturum açın.</p>

  <form (ngSubmit)="giris()" #form="ngForm" data-testid="login-form">
    <label class="alan">
      Kullanıcı adı
      <input name="userName" [(ngModel)]="userName" required autocomplete="username"
             autofocus data-testid="login-user" />
    </label>
    <label class="alan">
      Parola
      <input name="password" type="password" [(ngModel)]="password" required
             autocomplete="current-password" data-testid="login-password" />
    </label>

    @if (hata(); as mesaj) {
      <p class="hata" role="alert" data-testid="login-hata">{{ mesaj }}</p>
    }

    <button type="submit" [disabled]="form.invalid || gonderiliyor()" data-testid="login-submit">
      {{ gonderiliyor() ? 'Giriş yapılıyor…' : 'Giriş yap' }}
    </button>
  </form>
</section>
